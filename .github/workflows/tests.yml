name: tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately a bare `push:` rather than `push: branches: [master]`: this
# lets a hotfix branch be validated by CI before it is merged, not only
# after. Controller ruling — keep as-is.
on:
  push:
  pull_request:
  workflow_dispatch:

# ubuntu-latest only: macos-latest and windows-latest were removed. That
# means every bash-3.2 and BSD-tool-portability claim in this plugin's
# scripts (find/grep/sed without GNU-only flags, no bash 4+ constructs,
# the ${arr[@]+"${arr[@]}"} empty-array guard, the D3 signal-trap
# registration) is verified by static analysis in tests/test-portability.sh
# only, not by actually running under 3.2 anywhere in CI. It also means:
# - The two REQUIRES:bash<4.4 mutations (d3-empty-array-*) are permanently
#   skipped every run, since ubuntu-latest's bash is 5.x.
# - 54 [win]-labelled assertions never run here, and the 12
#   REQUIRES:windows mutations guarding them are skipped every run.
#   Windows executable resolution (PATHEXT finding a .cmd/.bat through
#   Get-Command -CommandType Application) and USERPROFILE/C:\-rooted
#   paths cannot hold on Linux, so those assertions are gated on the
#   host OS rather than left to fail here. The suite prints the count
#   and the reason: 168 run + 54 skipped is the 222 a Windows host runs.
# - The PowerShell coverage this CI does have is
#   tests/test-powershell-syntax.sh. ubuntu-latest ships pwsh, so all
#   five .ps1 files are genuinely parsed here — but parsing is not
#   execution. No PowerShell behaviour is exercised in this CI, only
#   syntax.
jobs:
  suite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # bash -c '...' rather than piping into head: under Actions' default
      # `bash -eo pipefail {0}`, a pipe into `head` reproduces the exact
      # SIGPIPE race tests/test-portability.sh bans in the plugin's own
      # scripts.
      - name: Report the shell under test
        shell: bash
        run: |
          bash -c 'echo "$BASH_VERSION"'
          echo "default /bin/bash:"
          /bin/bash -c 'echo "$BASH_VERSION"' 2>/dev/null || echo "(no /bin/bash)"

      - name: Run the suite
        shell: bash
        run: bash tests/run-tests.sh

      - name: Run mutations
        shell: bash
        run: bash tests/run-mutations.sh
